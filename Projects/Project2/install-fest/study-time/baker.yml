# CS3704 Project 2 — StudyTime
# https://github.com/CKepperling/StudyTime
#
# FastAPI + Celery + Postgres + Redis backend, React 19 / Vite frontend. The
# supported way to run it is Docker Compose; Python and Node are only needed
# on the host for the README's test/lint flow, mirrored in commands: below.
#
# Download this file into the root of your fork as baker.yml (see README.md), then:
#
#   cd StudyTime
#   baker bake .
#   baker run setup
#
# ⚠️ DOCKER IS NOT INSTALLED BY BAKER. 
#
# local: {} is the current directory where the agents and skills will land.

name: cs3704-studytime

local: {}

tools:
  - git
  - python
  - node
  - opencode:
      install: npm

# ---- agent-template extraction --------

resources:
  # The agents, skills, plugin, scripts, opencode.json, PHASE.md and docs/ from the agent-template repo.

  - git:
      repo: https://github.com/CS3704-VT/agent-template
      ref: extract
      dest: .
      extract: true

config:
  - files:
      - src: https://raw.githubusercontent.com/CS3704-VT/agent-template/main/AGENTS.md
        dest: AGENTS.md
        append: true
      - src: https://raw.githubusercontent.com/CS3704-VT/agent-template/main/.gitignore
        dest: .gitignore
        append: true
      # Git does not track .git/, so the hook cannot ride in the branch.
      - src: https://raw.githubusercontent.com/CS3704-VT/agent-template/main/hooks/post-commit
        dest: .git/hooks/post-commit
        mode: "0755"

commands:
  setup: |
    set -e
    cd backend && python3 -m venv .venv && .venv/bin/pip install -r requirements.txt ruff && cd ..
    cd frontend && npm ci && cd ..
    [ -f .env ] || echo "⚠️  No .env — copy one from a teammate (.env.example is missing from the repo)."
    echo ""
    echo "🍞 StudyTime is wired up with the CS3704 agents."

